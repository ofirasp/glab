<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Looper · Guitar Practice Lab</title>
<link rel="stylesheet" href="/scale-practice.css">
<style>
main{grid-template-rows:42px 48px auto minmax(0,1fr) 24px;gap:8px}
.controls,.draft,.loop-row{display:flex;align-items:center;gap:8px;min-width:0}
.controls label{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.controls select{min-width:0;width:100%}#recordLoop{min-width:124px}
#recordLoop.recording{background:#743740}
.draft input{min-width:0;flex:1;padding:9px;border:1px solid #526581;border-radius:8px;background:#192639;color:#eef3ff;font:16px system-ui}
#loops{overflow:auto;background:#192639;border-radius:12px;padding:8px}
.loop-row{padding:6px 4px;border-bottom:1px solid #34455d}
.loop-name{flex:1;overflow-wrap:anywhere;min-width:0}.loop-duration{color:#b9c9de;font-size:13px}
.loop-row button{flex:none}#message{white-space:normal}
dialog button+button{margin-left:8px}
</style>
<script src="/pi-microphone.js?v=wave" defer></script>
<script src="/playback-wake-lock.js" defer></script>
<script src="/touch-keyboard.js" defer></script>
<script src="/looper.js" defer></script>
</head>
<body><main>
<header><a href="/practice.html?tab=tools">‹ Back</a><h1>Looper</h1></header>
<div class="controls">
  <label>Microphone <select id="loopDevice"></select></label>
  <button id="recordLoop" class="primary" disabled>Record</button>
</div>
<div id="loopDraft" class="draft" hidden>
  <input id="loopName" maxlength="80" autocomplete="off" placeholder="Name this take" aria-label="Take name">
  <button id="previewLoop">Preview</button><button id="saveLoop" class="primary">Save</button><button id="discardLoop">Discard</button>
</div>
<section id="loops" aria-label="Saved loops"></section>
<p id="message" role="status"></p>
</main>
<audio id="loopAudio" loop preload="none"></audio>
<dialog id="removeLoopDialog" aria-labelledby="removeLoopTitle">
  <h2 id="removeLoopTitle">Delete saved loop?</h2><p id="removeLoopName"></p>
  <form method="dialog"><button value="cancel">Cancel</button><button id="removeLoop" value="remove">Delete</button></form>
</dialog>
</body></html>
