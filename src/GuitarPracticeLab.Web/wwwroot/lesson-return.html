<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>← Practice</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101827;color:#eef3ff;font:18px system-ui}main{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:18px}h1{font-size:25px;margin:0}button{background:#2869be;color:white;border:1px solid #8bbcff;border-radius:12px;padding:14px 24px;font:bold 21px system-ui;min-height:60px;touch-action:manipulation}button:disabled{opacity:.45}.capture{width:min(620px,100%);padding:14px;border-radius:12px;background:#19283a;display:flex;flex-direction:column;align-items:center;gap:8px}#captureTitle{font-size:19px;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}#captureUrl{font-size:12px;color:#b5c5da;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#captureStatus,#returnStatus{font-size:14px;color:#b5c5da;min-height:20px;margin:0}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}#refreshLesson{background:#293950;font-size:16px;min-height:44px;padding:8px 18px}
</style><script src="/lesson-return.js" defer></script></head><body><main>
<h1>Save your lesson or return to practice</h1>
<section class="capture" aria-label="Last lesson viewed"><strong id="captureTitle">Reading the lesson tab…</strong><span id="captureUrl"></span><div class="buttons"><button id="saveCurrentLesson" disabled>Save current lesson</button><button id="refreshLesson">Refresh lesson</button></div><p id="captureStatus" role="status">No copying or typing needed.</p></section>
<button id="returnPractice">← Return to Practice</button><span id="returnStatus" role="status"></span>
</main></body></html>
