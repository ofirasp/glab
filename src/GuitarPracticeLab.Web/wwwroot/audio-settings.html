<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Settings</title><link rel="stylesheet" href="/song-library.css"><style>body{margin:0;background:#101b2b;color:#eef3ff}#timingCalibrationDialog{position:static;box-sizing:border-box;margin:12px auto;width:calc(100% - 24px);max-width:850px;max-height:calc(100dvh - 24px)}.dialogbody{overflow:auto}button,select{min-height:42px}</style><script src="/pi-microphone.js?v=shared-pcm" defer></script><script src="/timing-adjustment.js?v=global" defer></script><script src="/guitar-strum-timing.js?v=shared-pcm" defer></script><script src="/song-timing-calibration.js?v=bar-calibration-scope" defer></script></head><body><dialog open id="timingCalibrationDialog" aria-labelledby="timingCalibrationTitle">
  <div class="dialoghead"><h2 id="timingCalibrationTitle">Audio Settings · Microphone timing</h2><button id="closeTimingCalibration">Close</button></div>
  <div class="dialogbody stack">
    <p class="hint">Wear headphones. Wait for 4 get-ready beats. Then lightly mute the strings and strum down once with each STRUM beep.</p>
    <div class="calibration-options"><label>Microphone <select id="calibrationDevice"></select></label><label>Pulse speed <select id="calibrationTempo"><option value="40">Slow · 40 BPM</option><option value="60">60 BPM</option></select></label></div>
    <div class="calibration-result"><div id="calibrationPulse" aria-label="Calibration pulse">♪</div><div><span id="calibrationStatus" role="status">Ready to measure.</span><strong id="calibrationSuggestion">—</strong><div id="calibrationBeats"></div></div></div>
    <div class="calibration-adjust"><span>Fine adjustment</span><span class="grow"></span><button id="calibrationMinus">−10 ms</button><output id="calibrationOffset">0 ms</output><button id="calibrationPlus">+10 ms</button></div>
    <p class="hint" id="calibrationHelp">Strum together with the beep—not after hearing it. The suggestion includes your response timing.</p>
  </div>
  <div class="dialogfoot"><button id="startTimingCalibration">Start calibration</button><button id="previewTimingCalibration">♪ Hear pulse</button><button id="resetTimingCalibration">Reset</button><span class="grow"></span><button id="applyTimingCalibration" class="primary">Apply correction</button></div>
</dialog></body></html>
